services:
  postgres:
    image: postgres:16-alpine
    container_name: blue_ocean_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blue_ocean}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blue_ocean}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blue_ocean_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-blue_ocean}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,https://blueocean.so}
      MEDIA_ROOT: /app/media
      MEDIA_URL_PREFIX: /media
      DEBUG: "false"
    volumes:
      - media_uploads:/app/media
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  media_uploads:
